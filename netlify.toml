[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Every page serves two representations at the same URL — HTML for browsers,
# Markdown under `Accept: text/markdown` — so shared caches have to key on
# Accept. Next.js overwrites the Vary header it manages on App Router page
# responses, so the full set is restated here at the CDN edge: Next's own RSC
# tokens plus Accept.
[[headers]]
  for = "/*"
  [headers.values]
    Vary = "RSC, Next-Router-State-Tree, Next-Router-Prefetch, Next-Router-Segment-Prefetch, Accept-Encoding, Accept"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/news/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"
