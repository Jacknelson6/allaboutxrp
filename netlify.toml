[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Collapse protocol and hostname normalization into a single permanent hop.
[[redirects]]
  from = "http://www.allaboutxrp.com/*"
  to = "https://allaboutxrp.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.allaboutxrp.com/*"
  to = "https://allaboutxrp.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://allaboutxrp.com/*"
  to = "https://allaboutxrp.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/news/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"
