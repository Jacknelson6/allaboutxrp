[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/guides/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/news/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=31536000"
