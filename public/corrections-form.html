<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Corrections form</title></head>
  <body>
    <form name="corrections" method="POST" action="/corrections/thanks" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="corrections">
      <input name="bot-field">
      <input type="url" name="page-url">
      <textarea name="disputed-claim"></textarea>
      <textarea name="proposed-correction"></textarea>
      <input type="url" name="source-url">
      <input type="email" name="email">
    </form>
  </body>
</html>
